[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isales-telephony"
version = "0.1.0"
description = "telephony-api (HTTP) + modem-controller (daemon) for the iSales platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "iSales" }]
dependencies = [
    "isales-common>=0.1.2,<0.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "apscheduler>=3.10",
    'pyudev>=0.24; platform_system == "Linux"',
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.0",
    "ruff>=0.3",
    "mypy>=1.8",
    "types-redis",
]
hardware = [
    "pyserial>=3.5",
]

[project.scripts]
telephony-api = "isales_telephony.api.main:run"
modem-controller = "isales_telephony.modem_controller.main:run"

[tool.hatch.build.targets.wheel]
packages = ["isales_telephony"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "C4",
    "ASYNC",
    "SIM",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "pyudev.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
