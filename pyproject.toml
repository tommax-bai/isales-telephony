[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isales-telephony"
version = "0.1.0"
description = "telephony-api (HTTP) + modem-controller (daemon) for the iSales platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "iSales" }]
dependencies = [
    "isales-common>=0.4.0,<0.5",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "structlog>=24.1",
    "numpy>=1.26",
    "scipy>=1.12",
    "grpcio>=1.60",
    "protobuf>=5.0",
    'pyudev>=0.24; platform_system == "Linux"',
    # pyserial is cross-platform (Linux /dev/ttyUSB*, macOS /dev/cu.usbmodem*,
    # Windows COM*). modem-controller uses pyserial.tools.list_ports for
    # device discovery on every platform; impl-deploy-macos PR #5 promoted it
    # from Linux-only extras to cross-platform main deps.
    "pyserial>=3.5",
    "pyserial-asyncio>=0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "testcontainers[postgres]>=4.0",
    "ruff>=0.3",
    "mypy>=1.8",
    "types-redis",
]
# Legacy alias for stage 6 Linux ALSA work. After impl-deploy-macos PR #5,
# pyserial moved to main `dependencies`; this group is now ALSA-only.
hardware = [
    'pyalsaaudio>=0.10; platform_system == "Linux"',
]
# Linux backend extras (impl-deploy-macos PR #2). pyudev + pyserial are
# already in main `dependencies` (with platform markers where needed); this
# alias only adds the ALSA audio bit.
linux = [
    'pyalsaaudio>=0.10; platform_system == "Linux"',
]
# macOS backend extras (impl-deploy-macos PR #2). Apple Silicon + macOS 14+
# only — see openspec/specs/architecture for the platform contract.
# Install with `pip install -e ".[macos]"` on a Mac dev / production host.
#
# Note: USB hot-plug detection on macOS uses `pyserial.tools.list_ports`
# polling (1 Hz cadence is adequate — GSM modems take 3–5 s to become usable
# after insertion). We deliberately do NOT depend on pyobjc-framework-IOKit
# because that package is not published separately on PyPI; ctypes-based
# IOKit access is reserved for follow-up if polling proves insufficient.
#
# sounddevice is cross-platform (PortAudio → Core Audio on macOS, ALSA on
# Linux). It is the macOS audio backend; on Linux we keep `pyalsaaudio` as
# the canonical option (`hardware` / `linux` extras above).
macos = [
    'sounddevice>=0.4.6',
]
# macOS dev / QA DingRTC extras (engine-rtc-dingrtc-migration § 8).
#
# Optional PyObjC bindings used by
# isales_telephony.audio_bridge.macos_dingrtc_pyobjc to load the
# DingRTC macOS framework (Obj-C only) into a Python process. ONLY
# needed on macOS dev / QA hosts that want to join real DingRTC
# channels — CI, unit-test, and the Windows commercial path are
# unaffected.
#
# The DingRTC framework itself ships as `DingRTC.framework` and is
# NOT installed by pip; per `reference_artc_sdk.md` it lives under
# `~/codes/vendor/DingRTC_macOS_SDK_3_9_0/` and is gitignored. The
# binding pre-loads sibling deps via ctypes.CDLL(RTLD_GLOBAL) then
# resolves the Obj-C classes via objc.lookUpClass (objc.loadBundle is
# best-effort for formal-protocol registration only).
#
# Markers MUST keep non-macOS installs clean.
macos-dingrtc = [
    'pyobjc-core>=10.0; platform_system == "Darwin"',
    'pyobjc-framework-Cocoa>=10.0; platform_system == "Darwin"',
]
# Deprecated alias kept one release post-dingrtc-migration archive so
# existing macOS dev environments installed with the old `[macos-artc]`
# extras continue to resolve to the same pyobjc deps. Remove when the
# `macos_artc_pyobjc.py` removal (§ 8.9) hits a release tag. New
# installs SHOULD use `macos-dingrtc`.
macos-artc = [
    'pyobjc-core>=10.0; platform_system == "Darwin"',
    'pyobjc-framework-Cocoa>=10.0; platform_system == "Darwin"',
]
# Windows backend extras (windows-client-core D1).
# - pystray + PySide6 + qasync: tray icon + activation UX + Qt/asyncio
#   event-loop integration (single-process Python edge client)
# - pywin32: HKCU Run-key registration + tray notify
# Note: sounddevice / PortAudio is intentionally absent. v1.0 modem SKU
# (SIMCom SIM7600G-H) does not register a USB Audio Class endpoint on
# Windows; audio I/O goes through the SerialPcm-over-COM backend (see
# isales_telephony.modem_controller.audio.windows_serial_pcm) which
# uses pyserial (already in main deps). Decision logged in
# windows-client-core/design.md Decision 3 amend (2026-05-17).
# pyserial is in main `dependencies`; no Windows-only PortAudio wheel.
# Markers MUST keep macOS / Linux installs clean — none of these wheels
# install on non-Windows hosts.
windows = [
    'pystray>=0.19; platform_system == "Windows"',
    'PySide6>=6.6; platform_system == "Windows"',
    'qasync>=0.27; platform_system == "Windows"',
    'pywin32>=306; platform_system == "Windows"',
]

[project.scripts]
telephony-api = "isales_telephony.api.main:run"
modem-controller = "isales_telephony.modem_controller.main:run"
# arch-cloud-edge-split task 7.1: unified edge daemon (modem-controller +
# audio-bridge + cloud-edge gRPC client in one asyncio process).
# The `modem-controller` entry point above remains for back-compat / debug;
# production launchd uses `isales-telephony-edge`.
isales-telephony-edge = "isales_telephony.edge.main:run"

[tool.hatch.build.targets.wheel]
packages = ["isales_telephony"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "C4",
    "ASYNC",
    "SIM",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "pyudev.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true

# pyserial ships no type stubs (PEP-561); we only call the well-known
# `comports()` / `ListPortInfo.{device,vid,pid,serial_number}` shape.
[[tool.mypy.overrides]]
module = "serial.*"
ignore_missing_imports = true

# sounddevice ships no type stubs.
[[tool.mypy.overrides]]
module = "sounddevice"
ignore_missing_imports = true

# grpcio has no first-party type stubs (types-grpcio is community-
# maintained and lags upstream). Treat the import surface as untyped.
[[tool.mypy.overrides]]
module = ["grpc.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Generated gRPC service stubs in isales-common don't carry type
# annotations on the bridge helpers; skip strict checks at their call
# sites here (the wire schema lives in cloud_edge.proto + .pyi).
module = ["isales_common.proto.*"]
ignore_errors = true

# scipy ships partial type stubs only; signal.resample_poly typing is
# loose. Accept missing imports here.
[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# impl-real-at: tests/conftest.py opts the ATClient dispatcher into
# MockATClient mode via ISALES_ALLOW_MOCK_AT=1 at import time. Production
# deployments MUST NOT set that env var — see
# modem_controller/main.py:_make_at_client.
