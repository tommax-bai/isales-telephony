name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: isales
          POSTGRES_PASSWORD: isales
          POSTGRES_DB: isales_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ISALES_DATABASE_URL: postgresql+asyncpg://isales:isales@localhost:5432/isales_test
      ISALES_REDIS_URL: redis://localhost:6379/0
      ISALES_JWT_SECRET: test-secret-do-not-use-in-prod

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Until isales-common is on a private package index, install it from a
      # tagged git URL. This requires v0.1.2 to be tagged in the isales-common
      # repo (impl-telephony tasks 1.6/1.7).
      - name: Install isales-common (v0.1.2 git tag)
        run: pip install "isales-common @ git+https://github.com/tommax-bai/isales-common@v0.1.2"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Mypy
        run: mypy isales_telephony

      - name: Pytest
        run: pytest -v

  windows-tests:
    # Windows-only unit coverage for the windows-client-core (D1) backend:
    # WASAPI audio (mocked sounddevice), tray controller helpers, env
    # writer, activation flow, state bus. The full main_windows.py qasync
    # path is exercised by hand on a real Windows PC during D1 PoC week 1
    # (windows-client-core tasks 9.1 / 9.2); CI only covers the
    # cross-platform-testable surface so Windows-specific regressions
    # land on PR review, not on the operator's machine.
    runs-on: windows-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install isales-common (v0.1.2 git tag)
        run: pip install "isales-common @ git+https://github.com/tommax-bai/isales-common@v0.1.2"

      - name: Install with Windows extras
        run: pip install -e ".[dev,windows]"

      - name: Pytest (windows suite)
        # Scope: Windows-specific backend (tests/windows), cross-platform
        # dispatch / shim layers (tests/test_platforms_dispatch.py +
        # tests/modem_serial), and the modem / edge tests that became
        # Windows-collectable once at_client.py stopped importing fcntl
        # at module top level (windows-client-core §3.7-§3.9, PR #11).
        # PG-gated tests skip here (the windows-latest runner has no
        # PostgreSQL service container); they run in full on the
        # lint-and-test job.
        run: pytest -v tests/windows tests/test_platforms_dispatch.py tests/modem_audio tests/modem_serial tests/test_modem_dial.py tests/test_modem_pump_cancel.py tests/test_fake_modem_e2e.py tests/edge/test_orchestrator.py
